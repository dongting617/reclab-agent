[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reclab-agent"
version = "0.2.0"
description = "A verifiable tool-use agent environment for recommendation experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
openai = ["openai>=2.0"]
service = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "jinja2>=3.1,<4"]
orchestration = ["langgraph>=1,<2", "langgraph-checkpoint-sqlite>=2,<4"]
test = ["httpx>=0.27,<1"]

[project.scripts]
reclab = "reclab_agent.cli.diagnostics:main"
reclab-research = "reclab_agent.cli.research:main"

[tool.setuptools.package-data]
"reclab_agent.web" = ["templates/*.html", "static/*.js", "static/*.css"]

[tool.setuptools.packages.find]
include = ["reclab_agent", "reclab_agent.*"]
